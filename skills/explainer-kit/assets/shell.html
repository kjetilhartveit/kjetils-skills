<link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="ev-topbar">
    <div class="ev-docname"><span><!--EV:TITLE--></span></div>

<!--EV:OVERVIEW-->

<!--EV:TABS-->

<!--
  Template for assemble.py. Markers:
    EV:HTML-ATTRS  optional attributes on <html> (e.g. data-ev-theme="ocean" from --theme)
    EV:TITLE       page name (both <title> and the top-left document name)
    EV:KIT-CSS     replaced by <style>kit.css</style>
    EV:KIT-JS      replaced by <script>kit.js</script> (in <head>, so EV exists before fragments run)
    EV:OVERVIEW    the overview fragment (<header class="ev-overview">…</header>); may be empty
    EV:TABS        tabbed mode:  <div class="ev-tabbar"><div class="ev-tablist" role="tablist">…</div></div>
                                 <main class="ev-panels"> fragment sections, each role="tabpanel" </main>
                   standalone:   <main class="ev-panels ev-standalone"> one fragment section </main>
                                 (no tab bar; kit.js fires ev:tabshow on the section immediately)
  This comment is stripped from the output.
-->
